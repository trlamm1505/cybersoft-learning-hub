[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersoft-data-ai-lab"
version = "0.1.0"
description = "Hạ tầng tài nguyên Dữ liệu và AI cho CyberSoft Learning Hub"
readme = "README.md"
authors = [
    { name = "Dao Trung Kien", email = "kien.dt@cybersoft.edu.vn" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "pandas>=2.2.1",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "chromadb>=0.4.24",
    "sentence-transformers>=2.5.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "ruff>=0.6.2",
    "pre-commit>=3.6.2"
]
gpu = [
    "torch>=2.2.0",
    "torchvision>=0.17.0"
]

# --- CẤU HÌNH RUFF LINTER & FORMATTER (Chuẩn PEP 8) ---
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (sắp xếp import tự động)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Bỏ qua độ dài dòng quá dài do Ruff formatter tự xử lý
    "B008", # Cho phép Depends trong FastAPI function arguments
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# --- CẤU HÌNH PYTEST ---
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers --tb=short"
pythonpath = ["src"]
