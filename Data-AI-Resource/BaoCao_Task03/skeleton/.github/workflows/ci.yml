name: CyberSoft Data & AI Lab CI

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-gate:
    name: Code Quality & Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies (CPU-First Standard)
        run: |
          python -m pip install --upgrade pip
          pip install -r Data-AI-Resource/BaoCao_Task03/skeleton/requirements-dev.txt || pip install -r requirements-dev.txt

      - name: Verify Environment Template (.env.example)
        run: |
          test -f Data-AI-Resource/BaoCao_Task03/skeleton/.env.example || test -f .env.example
          echo "Environment template verified."

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Ruff Format Check
        run: |
          ruff format --check .

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v
