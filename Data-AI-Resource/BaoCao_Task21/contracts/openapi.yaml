- name: Health & Metadata
  description: Endpoints kiểm tra sức khỏe hệ thống, uptime và thông tin hợp đồng
    OpenAPI.
- name: Dataset Registry & Projects
  description: Quản lý danh mục bộ dữ liệu (Datasets) và ngân hàng đề án học viên
    (Project Bank).
- name: Semantic Search & Retrieval
  description: Tìm kiếm ngữ nghĩa và tìm kiếm lai (Hybrid Search BM25 + Vector Dense
    RRF) trên học liệu.
- name: AI Tutor & RAG Engine
