openapi: 3.1.0
info:
  title: CyberSoft Data & AI Lab Integration Service
  description: Cổng dịch vụ RESTful API v1.0 chuẩn hóa theo OpenAPI 3.1 cho phân hệ
    CyberSoft Data & AI Lab. Cung cấp hợp đồng tích hợp chính thức giữa phân hệ Data
    & AI Resource (TTS 01) với CyberSoft Learning & Contest Hub (TTS 02) và QA/Eval
    Platform (TTS 03).
  version: 1.0.0
paths:
  /api/v1/health:
    get:
      tags:
      - Health & Metadata
      summary: Kiểm tra trạng thái sức khỏe dịch vụ
      description: Trả về trạng thái hoạt động của hệ thống, thời gian uptime và sức
        khỏe của từng module nội bộ.
      operationId: get_health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_HealthResponse_'
  /api/v1/info:
    get:
      tags:
      - Health & Metadata
      summary: Thông tin kỹ thuật, OpenAPI contract & SLA cam kết
      description: Cung cấp metadata hợp đồng API, đường dẫn tài liệu Swagger/ReDoc
        và các chỉ số cam kết SLA với các phân hệ khác.
      operationId: get_info_api_v1_info_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_APIInfoResponse_'
  /api/v1/registry/datasets:
    get:
      tags:
      - Dataset Registry & Projects
      summary: Tra cứu danh sách datasets trong Registry
      description: Hỗ trợ lọc theo domain, độ khó, định dạng tệp, tag và hỗ trợ phân
        trang.
      operationId: list_datasets_api_v1_registry_datasets_get
      parameters:
      - name: domain
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Lọc theo lĩnh vực (Retail, HR/Operations, NLP/RAG, Education)
          title: Domain
        description: Lọc theo lĩnh vực (Retail, HR/Operations, NLP/RAG, Education)
      - name: difficulty_level
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Lọc theo độ khó (beginner, intermediate, advanced)
          title: Difficulty Level
        description: Lọc theo độ khó (beginner, intermediate, advanced)
      - name: format
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Lọc theo định dạng tệp (csv, json, jsonl)
          title: Format
        description: Lọc theo định dạng tệp (csv, json, jsonl)
      - name: tag
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Lọc theo thẻ phân loại
          title: Tag
        description: Lọc theo thẻ phân loại
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          description: Số lượng bản ghi tối đa trả về
          default: 10
          title: Limit
        description: Số lượng bản ghi tối đa trả về
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Vị trí bắt đầu
          default: 0
          title: Offset
        description: Vị trí bắt đầu
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_DatasetListResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/registry/datasets/{dataset_id}:
    get:
      tags:
      - Dataset Registry & Projects
      summary: Xem chi tiết metadata và lược đồ của một dataset
      description: Trả về thông tin chi tiết, schema cột, mã băm SHA-256 và mẫu preview
        3 dòng đầu.
      operationId: get_dataset_detail_api_v1_registry_datasets__dataset_id__get
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
          title: Dataset Id
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_DatasetDetail_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/registry/projects:
    get:
      tags:
      - Dataset Registry & Projects
      summary: Tra cứu danh mục đề án Capstone học viên
      description: Trả về danh sách các đề tài thực hành lớn (Data Analyst, AI Engineer)
        và tiêu chí chấm điểm.
      operationId: list_projects_api_v1_registry_projects_get
      parameters:
      - name: track
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Lọc theo chuyên ngành (Data Analyst, AI Engineer)
          title: Track
        description: Lọc theo chuyên ngành (Data Analyst, AI Engineer)
      - name: difficulty
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Lọc theo độ khó
          title: Difficulty
        description: Lọc theo độ khó
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 10
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_ProjectListResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/registry/projects/{project_id}:
    get:
      tags:
      - Dataset Registry & Projects
      summary: Xem chi tiết yêu cầu và rubric chấm điểm của đề án Capstone
      description: Cung cấp mục tiêu đầu ra, danh sách deliverables và tỷ trọng rubric
        chấm bài.
      operationId: get_project_detail_api_v1_registry_projects__project_id__get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_ProjectDetail_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/search/semantic:
    post:
      tags:
      - Semantic Search & Retrieval
      summary: Tìm kiếm lai kết hợp ngữ nghĩa và từ khóa trên học liệu
      description: Thực thi thuật toán kết hợp BM25 và Vector Dense RRF để tìm các
        đoạn trích giáo trình phù hợp nhất.
      operationId: search_semantic_api_v1_search_semantic_post
      parameters:
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SemanticSearchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_SemanticSearchResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/search/chunks/{chunk_id}:
    get:
      tags:
      - Semantic Search & Retrieval
      summary: Tra cứu chi tiết một đoạn trích giáo trình theo mã chunk_id
      description: Trả về toàn văn nội dung, tiêu đề tài liệu, mục và thẻ phân loại
        của chunk.
      operationId: get_chunk_api_v1_search_chunks__chunk_id__get
      parameters:
      - name: chunk_id
        in: path
        required: true
        schema:
          type: string
          title: Chunk Id
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_SearchChunkItem_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tutor/chat:
    post:
      tags:
      - AI Tutor & RAG Engine
      summary: Hỏi đáp thông minh với Trợ giảng AI Tutor có trích nguồn
      description: Truy xuất kiến thức từ học liệu CyberSoft, sinh câu trả lời có
        trích dẫn minh chứng, tự động kích hoạt Guardrails và cơ chế từ chối khi câu
        hỏi ngoài phạm vi đào tạo.
      operationId: chat_with_tutor_api_v1_tutor_chat_post
      parameters:
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TutorChatRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_TutorChatResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/quality/validate-dataset:
    post:
      tags:
      - Data Quality & QA Metrics
      summary: Kiểm định tính toàn vẹn và chất lượng của một dataset
      description: Thực thi các luật kiểm tra schema, missing values, duplicates và
        bounds; trả về kết luận PASSED hoặc FAILED cho Cổng chất lượng.
      operationId: validate_dataset_api_v1_quality_validate_dataset_post
      parameters:
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetValidationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_DatasetValidationResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/quality/metrics:
    get:
      tags:
      - Data Quality & QA Metrics
      summary: Truy xuất trọn bộ chỉ số Data Quality và RAG Benchmarks
      description: Cung cấp số liệu tổng hợp cho Quality Dashboard hợp nhất của TTS
        03 (QA) bao gồm Recall@5, MRR, Citation Precision, Groundedness và Latency
        p95.
      operationId: get_quality_metrics_api_v1_quality_metrics_get
      parameters:
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_QualityMetricsResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    APIInfoResponse:
      properties:
        name:
          type: string
          title: Name
          description: Tên dịch vụ tích hợp
        version:
          type: string
          title: Version
          description: Phiên bản hiện tại
        description:
          type: string
          title: Description
          description: Mô tả chức năng hệ thống
        openapi_spec_url:
          type: string
          title: Openapi Spec Url
          description: Đường dẫn tải hợp đồng OpenAPI JSON
          default: /api/v1/openapi.json
        swagger_docs_url:
          type: string
          title: Swagger Docs Url
          description: Giao diện tra cứu Swagger UI
          default: /docs
        redoc_url:
          type: string
          title: Redoc Url
          description: Giao diện tra cứu ReDoc
          default: /redoc
        sla_target:
          additionalProperties:
            type: string
          type: object
          title: Sla Target
          description: Cam kết chất lượng dịch vụ SLA (Độ trễ p95, Uptime)
        maintainer:
          additionalProperties:
            type: string
          type: object
          title: Maintainer
          description: Thông tin đội ngũ kỹ sư phụ trách
      type: object
      required:
      - name
      - version
      - description
      - sla_target
      - maintainer
      title: APIInfoResponse
      description: API metadata, contract specification and SLA commitments.
    ChatMessage:
      properties:
        role:
          type: string
          title: Role
          description: 'Vai trò phát ngôn: user | assistant | system'
        content:
          type: string
          title: Content
          description: Nội dung thông điệp
      type: object
      required:
      - role
      - content
      title: ChatMessage
      description: A single turn in conversational history.
    CitationItem:
      properties:
        source_id:
          type: string
          title: Source Id
          description: Mã định danh của tài liệu trích dẫn
        title:
          type: string
          title: Title
          description: Tên giáo trình hoặc quy chế đào tạo
        section:
          type: string
          title: Section
          description: Tên mục hoặc chương cụ thể
        excerpt:
          type: string
          title: Excerpt
          description: Đoạn văn bản trích dẫn làm chứng cứ xác thực
      type: object
      required:
      - source_id
      - title
      - section
      - excerpt
      title: CitationItem
      description: Structured citation reference for verifiable factual answer.
    DatasetColumnSchema:
      properties:
        name:
          type: string
          title: Name
          description: Tên trường dữ liệu
        type:
          type: string
          title: Type
          description: Kiểu dữ liệu (string, integer, float, datetime, boolean)
        nullable:
          type: boolean
          title: Nullable
          description: Trường có thể rỗng hay không
          default: false
        description:
          type: string
          title: Description
          description: Mô tả ý nghĩa nghiệp vụ của trường
          default: ''
      type: object
      required:
      - name
      - type
      title: DatasetColumnSchema
      description: Schema definition for a dataset column.
    DatasetDetail:
      properties:
        id:
          type: string
          title: Id
          description: Mã định danh duy nhất của dataset
        name:
          type: string
          title: Name
          description: Tên dataset
        domain:
          type: string
          title: Domain
          description: Lĩnh vực (Retail, HR/Operations, NLP/RAG, Education)
        difficulty_level:
          type: string
          title: Difficulty Level
          description: Độ khó (beginner, intermediate, advanced)
        format:
          type: string
          title: Format
          description: Định dạng tệp (csv, json, jsonl, parquet)
        records_count:
          type: integer
          title: Records Count
          description: Tổng số bản ghi dữ liệu
        current_version:
          type: string
          title: Current Version
          description: Phiên bản phát hành hiện tại
          default: v1.0
        tags:
          items:
            type: string
          type: array
          title: Tags
          description: Danh mục thẻ tìm kiếm nhanh
        is_public:
          type: boolean
          title: Is Public
          description: Học viên có quyền truy cập trực tiếp hay không
          default: true
        description:
          type: string
          title: Description
          description: Mô tả chi tiết bài toán và ngữ cảnh ứng dụng
        schema_definition:
          items:
            $ref: '#/components/schemas/DatasetColumnSchema'
          type: array
          title: Schema Definition
          description: Cấu trúc lược đồ dữ liệu chi tiết
        checksum_sha256:
          type: string
          title: Checksum Sha256
          description: Mã băm toàn vẹn SHA-256
        file_size_bytes:
          type: integer
          title: File Size Bytes
          description: Kích thước tệp tính bằng bytes
          default: 0
        created_at:
          type: string
          title: Created At
          description: Thời điểm khởi tạo ISO 8601
        license:
          type: string
          title: License
          description: Bản quyền sử dụng
          default: CyberSoft Academy Internal Use
        sample_preview:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Sample Preview
          description: Mẫu 3 bản ghi đầu tiên xem trước
      type: object
      required:
      - id
      - name
      - domain
      - difficulty_level
      - format
      - records_count
      - description
      - checksum_sha256
      - created_at
      title: DatasetDetail
      description: Detailed metadata and contracts for a registered dataset.
    DatasetItem:
      properties:
        id:
          type: string
          title: Id
          description: Mã định danh duy nhất của dataset
        name:
          type: string
          title: Name
          description: Tên dataset
        domain:
          type: string
          title: Domain
          description: Lĩnh vực (Retail, HR/Operations, NLP/RAG, Education)
        difficulty_level:
          type: string
          title: Difficulty Level
          description: Độ khó (beginner, intermediate, advanced)
        format:
          type: string
          title: Format
          description: Định dạng tệp (csv, json, jsonl, parquet)
        records_count:
          type: integer
          title: Records Count
          description: Tổng số bản ghi dữ liệu
        current_version:
          type: string
          title: Current Version
          description: Phiên bản phát hành hiện tại
          default: v1.0
        tags:
          items:
            type: string
          type: array
          title: Tags
          description: Danh mục thẻ tìm kiếm nhanh
        is_public:
          type: boolean
          title: Is Public
          description: Học viên có quyền truy cập trực tiếp hay không
          default: true
      type: object
      required:
      - id
      - name
      - domain
      - difficulty_level
      - format
      - records_count
      title: DatasetItem
      description: Summary item of a registered dataset.
    DatasetListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/DatasetItem'
          type: array
          title: Items
          description: Danh sách các dataset thỏa điều kiện
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
          description: Thông tin phân trang
      type: object
      required:
      - items
      - pagination
      title: DatasetListResponse
      description: Response payload for datasets list.
    DatasetValidationRequest:
      properties:
        dataset_id:
          type: string
          title: Dataset Id
          description: Mã định danh của dataset cần kiểm định
        check_rules:
          items:
            type: string
          type: array
          title: Check Rules
          description: Danh sách các bộ quy tắc kiểm định cần áp dụng
          default:
          - schema_conformance
          - missing_values
          - duplicate_rows
          - range_bounds
        max_missing_ratio_threshold:
          type: number
          maximum: 0.5
          minimum: 0.0
          title: Max Missing Ratio Threshold
          description: Ngưỡng tỷ lệ ô trống tối đa cho phép (mặc định 5%)
          default: 0.05
      type: object
      required:
      - dataset_id
      title: DatasetValidationRequest
      description: Payload to trigger an automated quality inspection on a dataset.
    DatasetValidationResponse:
      properties:
        dataset_id:
          type: string
          title: Dataset Id
          description: Mã định danh dataset được kiểm tra
        total_records:
          type: integer
          title: Total Records
          description: Tổng số dòng kiểm tra
        valid_records:
          type: integer
          title: Valid Records
