server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Nén các file văn bản.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API: chuyển sang backend trong mạng Docker (tên dịch vụ `backend`).
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 20m;
  }

  # File build có hash trong tên: cache lâu. index.html thì không cache.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: mọi đường dẫn khác trả index.html để react-router xử lý.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
